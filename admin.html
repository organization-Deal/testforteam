<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEAL! Exam Backoffice</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f5f5f7}body{margin:0}.wrap{max-width:1200px;margin:auto;padding:28px 18px}h1{margin:0 0 6px}.sub{color:#666;margin-bottom:20px}.tools{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:14px;border-radius:16px;box-shadow:0 8px 30px #0001;position:sticky;top:10px}input,button{font:inherit;padding:10px 12px;border:1px solid #ddd;border-radius:10px}input{min-width:260px;flex:1}button{background:#111;color:#fff;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{background:#fff;padding:16px;border-radius:16px}.big{font-size:26px;font-weight:800}.small{color:#777;font-size:12px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}th{font-size:12px;color:#666;background:#fafafa}.bad{color:#b42318;font-weight:700}.good{color:#067647;font-weight:700}details{max-width:460px}pre{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}table{min-width:900px}}</style></head><body><div class="wrap"><h1>DEAL! Exam Backoffice</h1><div class="sub">ดูชื่อผู้สอบ • เวลาส่ง • คะแนน • ข้อที่ผิด</div><div class="tools"><input id="key" type="password" placeholder="ADMIN KEY"><button id="load">โหลดข้อมูล</button><button id="csv">Export CSV</button></div><div class="stats"><div class="card"><div class="big" id="n">–</div><div class="small">จำนวนครั้งที่สอบ</div></div><div class="card"><div class="big" id="avg">–</div><div class="small">คะแนนเฉลี่ย</div></div><div class="card"><div class="big" id="pass">–</div><div class="small">ผ่าน ≥ 75%</div></div><div class="card"><div class="big" id="latest">–</div><div class="small">สอบล่าสุด</div></div></div><div class="tablewrap"><table><thead><tr><th>ชื่อ</th><th>เวลาสอบ (ไทย)</th><th>คะแนน</th><th>ผิด</th><th>ข้อที่ผิด</th><th>รายละเอียด</th></tr></thead><tbody id="rows"><tr><td colspan="6">ใส่ ADMIN KEY แล้วกดโหลดข้อมูล</td></tr></tbody></table></div></div><script>
let data=[]; const $=id=>document.getElementById(id); function thai(t){return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'medium',timeZone:'Asia/Bangkok'}).format(new Date(t.replace(' ','T')+'Z'))} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){const key=$('key').value;sessionStorage.setItem('deal_exam_admin_key',key);const r=await fetch('/api/results?limit=1000',{headers:{'x-admin-key':key}});if(!r.ok){alert('ADMIN KEY ไม่ถูกต้อง หรือระบบยังไม่ได้ตั้งค่า');return}const j=await r.json();data=j.results||[];render()}
function render(){ $('n').textContent=data.length; $('avg').textContent=data.length?(data.reduce((a,x)=>a+x.pct,0)/data.length).toFixed(1)+'%':'–'; $('pass').textContent=data.length?Math.round(data.filter(x=>x.pct>=75).length/data.length*100)+'%':'–'; $('latest').textContent=data[0]?thai(data[0].submitted_at):'–'; $('rows').innerHTML=data.map(x=>{let w=[];try{w=JSON.parse(x.wrong_json||'[]')}catch{};return `<tr><td><b>${esc(x.name)}</b></td><td>${thai(x.submitted_at)}</td><td class="${x.pct>=75?'good':'bad'}">${x.correct}/${x.total} (${x.pct}%)</td><td>${x.wrong_count}</td><td>${esc(x.wrong_nos||'–')}</td><td><details><summary>ดูคำตอบที่ผิด</summary>${w.map(i=>`<p><b>ข้อ ${i.no}</b> ${esc(i.question)}<br>ตอบ: ${esc(i.picked?i.picked.toUpperCase():'ไม่ได้ตอบ')} • เฉลย: <b>${esc(i.answer.toUpperCase())}</b></p>`).join('')||'ไม่มีข้อผิด'}</details></td></tr>`}).join('')||'<tr><td colspan="6">ยังไม่มีข้อมูล</td></tr>'}
function csv(){if(!data.length)return alert('ยังไม่มีข้อมูล');const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const rows=[['ชื่อ','เวลาสอบไทย','คะแนนถูก','ทั้งหมด','เปอร์เซ็นต์','จำนวนข้อผิด','ข้อที่ผิด'],...data.map(x=>[x.name,thai(x.submitted_at),x.correct,x.total,x.pct,x.wrong_count,x.wrong_nos])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DEAL_exam_results.csv';a.click();URL.revokeObjectURL(a.href)}
$('load').onclick=load;$('csv').onclick=csv;$('key').value=sessionStorage.getItem('deal_exam_admin_key')||'';
</script></body></html>
